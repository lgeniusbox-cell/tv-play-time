<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-white select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FloorMat Studio TV</title>
    <meta name="description" content="Video-reactive game engine for body-controlled floor mat games on Android TV with Gamepad API input." />
    <meta property="og:title" content="FloorMat Studio TV" />
    <meta property="og:description" content="Video-reactive game engine for body-controlled floor mat games on Android TV with Gamepad API input." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#030712" />
    <style>
      /* Android TV WebView display optimizations */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #030712;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* TV Focus outline styling */
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 3px solid #38bdf8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body class="overflow-hidden bg-slate-950">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
