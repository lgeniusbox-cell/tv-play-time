<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0f0720"/>
      <stop offset="100%" stop-color="#030008"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="320" cy="180" r="140" fill="url(#ringGlow)"/>
  <!-- Target circles -->
  <circle cx="320" cy="180" r="110" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="12 8"/>
  <circle cx="320" cy="180" r="70" fill="none" stroke="#ec4899" stroke-width="4"/>
  <circle cx="320" cy="180" r="30" fill="#a855f7" fill-opacity="0.4"/>
  <!-- Equalizer columns -->
  <rect x="180" y="240" width="16" height="60" rx="3" fill="#a855f7" fill-opacity="0.7"/>
  <rect x="204" y="210" width="16" height="90" rx="3" fill="#c084fc" fill-opacity="0.8"/>
  <rect x="228" y="170" width="16" height="130" rx="3" fill="#e879f9" fill-opacity="0.9"/>
  <rect x="396" y="170" width="16" height="130" rx="3" fill="#e879f9" fill-opacity="0.9"/>
  <rect x="420" y="210" width="16" height="90" rx="3" fill="#c084fc" fill-opacity="0.8"/>
  <rect x="444" y="240" width="16" height="60" rx="3" fill="#a855f7" fill-opacity="0.7"/>
  <!-- Timing strike line -->
  <line x1="120" y1="180" x2="520" y2="180" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Typography -->
  <text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="3">BEAT SYNC</text>
  <text x="320" y="100" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#f472b6" letter-spacing="4">RHYTHM ARENA • TIMELINE MODE</text>
</svg>
