<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="forestBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c16"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#forestBg)"/>
  <circle cx="320" cy="110" r="85" fill="url(#moon)"/>
  <!-- Bamboo / Tree Silhouettes -->
  <rect x="60" y="40" width="18" height="320" fill="#021f18" opacity="0.7"/>
  <rect x="140" y="80" width="14" height="280" fill="#032e24" opacity="0.8"/>
  <rect x="220" y="20" width="22" height="340" fill="#021f18" opacity="0.6"/>
  <rect x="420" y="50" width="16" height="310" fill="#032e24" opacity="0.8"/>
  <rect x="490" y="10" width="20" height="350" fill="#021f18" opacity="0.7"/>
  <rect x="560" y="90" width="14" height="270" fill="#032e24" opacity="0.8"/>
  <!-- Ground path -->
  <ellipse cx="320" cy="350" rx="360" ry="80" fill="#011611"/>
  <!-- Dynamic leap icon -->
  <path d="M 290 220 Q 320 160 350 220" stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Typography -->
  <text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="3">SHINOBI PATH</text>
  <text x="320" y="100" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#6ee7b7" letter-spacing="4">FOREST TRIAL • CLIPS MODE</text>
</svg>
