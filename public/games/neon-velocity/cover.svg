<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="320" cy="140" r="120" fill="url(#sun)"/>
  <!-- Perspective Road -->
  <polygon points="320,140 320,140 100,360 540,360" fill="#090d16" stroke="#06b6d4" stroke-width="2"/>
  <line x1="320" y1="140" x2="246" y2="360" stroke="#06b6d4" stroke-width="2" stroke-dasharray="10 15"/>
  <line x1="320" y1="140" x2="394" y2="360" stroke="#06b6d4" stroke-width="2" stroke-dasharray="10 15"/>
  <!-- Speed lines -->
  <line x1="80" y1="200" x2="20" y2="280" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="560" y1="200" x2="620" y2="280" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Glowing rings -->
  <ellipse cx="320" cy="280" rx="36" ry="12" fill="none" stroke="#facc15" stroke-width="4"/>
  <ellipse cx="246" cy="310" rx="28" ry="9" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <!-- Badge & Title -->
  <text x="320" y="80" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3">NEON VELOCITY</text>
  <text x="320" y="112" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="4">HIGHWAY RUN • SPEED MODE</text>
</svg>
